[project]
name = "RepoWhisper"
version = "0.1.0"
description = "An enterprise multi-agent AI pipeline to automatically document and analyze software repositories."
readme = "README.md"
authors = [
    { name = "Andrea Difino", email = "adifino13@gmail.com" }
]
license = { text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
keywords = ["documentation", "ai", "langgraph", "langchain", "agents", "ast"]
requires-python = ">=3.12, <3.13"
dependencies = [
    "chardet>=7.7.0",
    "chromadb>=1.5.9",
    "gitpython>=3.2.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.18",
    "sentence-transformers>=6.2.0",
    "tqdm>=4.70.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-languages>=1.10.2",
]

[project.optional-dependencies]
groq = ["langchain-groq>=1.1.3"]

[tool.setuptools.packages.find]
include = ["repowhisper*"]
