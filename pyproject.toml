[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RepoWhisper"
version = "0.5.0b4"
description = "An enterprise multi-agent AI pipeline to document and analyze Python repositories."
readme = "README.md"
authors = [
    { name = "Andrea Difino", email = "adifino13@gmail.com" }
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3.12",
]
keywords = ["documentation", "ai", "langgraph", "langchain", "agents", "ast"]
requires-python = ">=3.12, <3.13"
dependencies = [
    "chardet>=7.7.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.2.1",
    "langchain>=1.4.7",
    "langgraph>=1.2.18",
    "torch>=2.5.0",
    "laya>=0.4.38",
    "pydantic>=2.14.2",
    "tqdm>=4.70.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-languages>=1.10.2",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[project.optional-dependencies]
groq = ["langchain-groq>=1.1.3"]
ollama = ["langchain-ollama>=1.1.0"]
openai = ["langchain-openai>=1.8.0"]
anthropic = ["langchain-anthropic>=1.7.10"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["repowhisper", "repowhisper.*"]

[tool.setuptools.package-data]
"repowhisper" = ["ui_dist/**/*", "ui_dist/*","laya_reviewer_calibration/*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true